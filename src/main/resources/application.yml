#    timeout-per-shutdown-phase: 15s


server:
  port: 8084
  shutdown: graceful
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

#springdoc:
#  swagger-ui:
#    path: /swagger-ui

# application-prod.yml
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.http.converter: DEBUG
    org.springframework.validation: DEBUG
    org.springframework.web.reactive.result.method.annotation: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG
    org.flywaydb: DEBUG


emis:
  services:
    school-configuration:
      base-url: ${EMIS_SERVICE_URL:http://localhost:8082}
      get-school-details-url: ${emis.services.school-configuration.base-url}/api/v1/schools/{schoolCode}
      validate-school-exists-url: ${emis.services.configuration.base-url}/api/v1/schools/validate/{schoolCode}

    student-configuration:
      base-url: ${EMIS_SERVICE_URL:http://localhost:8083}
      get-student-details-url: ${emis.services.student-configuration.base-url}/api/v1/students
      get-active-enrollment-url: ${emis.services.student-configuration.base-url}/api/v1/students/{studentNumber}/enrollments/current

    timeout: 5
