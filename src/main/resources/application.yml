spring:
  application:
    name: academic-service

  r2dbc:
    username: academic_user
    password: ${ACADEMIC_DB_PASSWORD:academic_pwd}
    properties:
      schema: academic_schema
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/emis_db?schema=academic_schema
    pool:
      max-create-connection-time: 2s
      initial-size: 5
      max-size: 10

  flyway:
    user: academic_user
    password: ${FLYWAY_DB_PASSWORD:academic_pwd}
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/emis_db
    schemas: academic_schema
    default-schema: academic_schema
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

  cloud:
    stream:
      bindings:
        hrEvents-in-0:
          destination: hr.events.v1
          group: academic-service
          content-type: application/json
        attendance-out-0:
          destination: attendance.events.v1

      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}



#  security:
